<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <title>Frontend Mentor | Social links profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="social-links-profile.css">
</head>
<body>
  <a href="#" class="profile-dashboard-container">
    <img class="profile-photo" src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall's profile photo">

    <div class="profile-info">
      <span class="profile-name">Jessica Randall</span>
      <span class="profile-location">London, United Kingdom</span>
      <span class="profile-description">"Front-end developer and avid reader."</span>
    </div>

    <div class="profile-links">
      <button class="github-button">Github</button>
      <button class="frontend-mentor-button">Frontend Mentor</button>
      <button class="linkedin-button">LinkedIn</button>
      <button class="twitter-button">Twitter</button>
      <button class="instagram-button">Instagram</button>
    </div>

  </a>

</body>
</html>
